- type: entity
  id: SynthModuleBase
  parent: BaseItem
  name: base synth mod
  abstract: true
  components:
    - type: SiliconModule
    - type: Sprite
      sprite: Objects/Specific/Robotics/borgmodule.rsi
      state: engineering

- type: entity
  id: SynthModTest
  parent: SynthModuleBase
  name: base synth mod
  components:
    - type: Item
      storedRotation: -90
      inhandVisuals:
        left:
          - state: base-icon-inhand-left
            color: "#8FCBCB"
          - state: base-module-inhand-left
            color: "#A1A1A1"
          - state: base-part-inhand-left
          - state: base-stripes-inhand-left
            color: "#7D7D7D"
        right:
          - state: base-icon-inhand-right
            color: "#8FCBCB"
          - state: base-module-inhand-right
            color: "#A1A1A1"
          - state: base-part-inhand-right
          - state: base-stripes-inhand-right
            color: "#7D7D7D"
    - type: Sprite
      sprite: Objects/Specific/Robotics/borgmodule.rsi
      state: engineering

- type: entity
  id: SynthModHiddenUplink
  parent: BaseUplinkRadio20TC
  name: portable radio
  description: It looks like it could be easily hidden somewhere..
  components:
    - type: SiliconModule
    - type: Sprite
      sprite: Objects/Devices/communication.rsi
      layers:
        - state: old-radio
    - type: Item
      sprite: Objects/Devices/communication.rsi
      heldPrefix: old-radio
    - type: UserInterface
      interfaces:
        enum.StoreUiKey.Key:
          type: StoreBoundUserInterface
    - type: ActivatableUI
      key: enum.StoreUiKey.Key
    - type: Store
      balance:
        Telecrystal: 0
    - type: ScaleVisuals
      scale: 0.8, 0.8

- type: entity
  id: SynthModInstallationRight
  parent: SynthModuleBase
  name: synth installation (right)
  components:
    - type: Tag
      tags: [ArmInstallationRight]
    - type: Item
      size: Normal
      sprite: null
    - type: SiliconModuleBlacklist
      moduleBlacklist:
        tags: [ArmInstallationRight]

- type: entity
  id: SynthModInstallationLeft
  parent: SynthModuleBase
  name: synth installation (left)
  components:
    - type: Tag
      tags: [ArmInstallationLeft]
    - type: Item
      size: Normal
      sprite: null
    - type: SiliconModuleBlacklist
      moduleBlacklist:
        tags: [ArmInstallationLeft]

- type: entity
  id: SynthModIntegratedSMG
  parent: SynthModuleBase
  name: integrated SMG synth installation (right)
  components:
    - type: SiliconModuleArmInstallation
      item: WeaponSubMachineGunSw002Integrated
    - type: Tag
      tags: [ArmInstallationRight]
    - type: SiliconModuleBlacklist
      moduleBlacklist:
        tags: [ArmInstallationRight]
    - type: Sprite
      sprite: _Paradise/Objects/Weapons/Guns/SMGs/sw002.rsi
      state: base

- type: entity
  id: SynthModIntegratedBladeRight
  parent: SynthModInstallationRight
  name: integrated blade synth installation (right)
  components:
    - type: Sprite
      sprite: _Paradise/Objects/Weapons/Melee/armblade_installation.rsi
      state: icon
    - type: SiliconModuleArmInstallation
      item: SynthArmBlade

- type: entity
  id: SynthModIntegratedBladeLeft
  parent: SynthModInstallationLeft
  name: integrated blade synth installation (left)
  components:
    - type: Sprite
      sprite: _Paradise/Objects/Weapons/Melee/armblade_installation.rsi
      state: icon
    - type: SiliconModuleArmInstallation
      item: SynthArmBlade
      holdingContainerHandId: left

- type: entity
  parent: [BaseItem, SynthModuleBase]
  id: SynthModMagpads
  name: magpads
  description: Magnetic boots, often used during extravehicular activity to ensure the user remains safely attached to the vehicle.
  components:
    - type: ItemToggle
      onUse: false
      onActivate: false
    - type: Item
      storedRotation: -90
      inhandVisuals:
        left:
          - state: base-icon-inhand-left
            color: "#8FCBCB"
          - state: base-module-inhand-left
            color: "#A1A1A1"
          - state: base-part-inhand-left
          - state: base-stripes-inhand-left
            color: "#7D7D7D"
        right:
          - state: base-icon-inhand-right
            color: "#8FCBCB"
          - state: base-module-inhand-right
            color: "#A1A1A1"
          - state: base-part-inhand-right
          - state: base-stripes-inhand-right
            color: "#7D7D7D"
    - type: Sprite
      sprite: Objects/Specific/Robotics/borgmodule.rsi
      state: engineering
    - type: SiliconModuleToggleable
      action: ActionToggleMagboots
    - type: ComponentToggler
      components:
        - type: NoSlip
    - type: Magboots
    - type: StaticPrice
      price: 200
